name: Audit B2 audio

on:
  workflow_dispatch:
    inputs:
      model:
        description: Whisper model
        required: true
        default: small
        type: choice
        options:
          - small
          - medium
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-b2-audio.yml
      - scripts/audit_b2_audio.py
      - audit/b2_expected_manifest.json

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install transcription tools
        run: pip install faster-whisper==1.2.1
      - name: Audit all B2 audio
        run: python scripts/audit_b2_audio.py --model "${{ inputs.model || 'small' }}"
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2-audio-audit
          path: audit-results/
          retention-days: 30
          if-no-files-found: error
